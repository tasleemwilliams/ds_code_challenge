# Settings for the whole pipeline. Paths are relative to the repository root.
# docs/DESIGN.md explains the reasoning behind each threshold and choice.

paths:
  cache_dir: data/cache
  fallback_dir: data/fallback
  output_dir: output

sources:
  base_url: https://cct-ds-code-challenge-input-data.s3.af-south-1.amazonaws.com
  credentials_file: ds_code_challenge_creds.json
  reference_hexes_file: city-hex-polygons-8.geojson
  service_requests_file: sr.csv.gz
  service_requests_hex_file: sr_hex.csv.gz

download:
  attempts: 4
  backoff_seconds: 2.0
  max_backoff_seconds: 20.0
  connect_timeout_seconds: 10.0
  read_timeout_seconds: 60.0

extraction:
  bucket: cct-ds-code-challenge-input-data
  region: af-south-1
  key: city-hex-polygons-8-10.geojson
  resolution: 8
  schema_file: config/hex_schema.yaml

join:
  # Share of requests that have coordinates but do not join to a city hexagon.
  max_failure_rate: 0.001
  # Share of all requests without coordinates. The observed rate is 22.6%.
  max_missing_coordinate_rate: 0.35

subsample:
  suburb: SAXONSEA
  radius_arcminutes: 1.0
  suburbs_query_url: https://esapqa.capetown.gov.za/agsext/rest/services/Theme_Based/ODP_SPLIT_5/FeatureServer/3/query
  suburb_name_field: OFC_SBRB_NAME
  # Guards against a suburb that shares a name pattern but is elsewhere in the city.
  atlantis_area:
    min_lat: -33.62
    max_lat: -33.50
    min_lon: 18.44
    max_lon: 18.55

wind:
  station: Atlantis AQM Site
  year: 2020
  fallback_file: wind_2020.xlsx
  # Tried in order. See cct_pipeline/wind.py for why the strategy works this way.
  sources:
    - name: city_download_handler
      url: https://www.capetown.gov.za/_layouts/OpenDataPortalHandler/DownloadHandler.ashx?DocumentName=Wind_direction_and_speed_2020.ods&DatasetDocument=https%3A%2F%2Fcityapps.capetown.gov.za%2Fsites%2Fopendatacatalog%2FDocuments%2FWind%2FWind_direction_and_speed_2020.ods
    - name: open_data_portal
      url: https://www.arcgis.com/sharing/rest/content/items/31ef242a23484e79bbb19d6b29203179/data
  # Below this share of subsample requests with a reading, the join is treated as broken.
  min_request_coverage: 0.25

anonymisation:
  time_block_hours: 6
  # Fewest records allowed to share the same values in quasi_identifiers.
  min_group_size: 5
  quasi_identifiers: [h3_level8_index, code, cause_code]
  # Only these source columns can reach the anonymised output.
  retained_columns:
    - h3_level8_index
    - directorate
    - department
    - code_group
    - code
    - cause_code_group
    - cause_code
  # Requests matching these patterns reveal something personal about a household, so
  # they go to manual review whatever their group size.
  sensitive_fields: [department, code_group, code, cause_code_group, cause_code]
  sensitive_patterns:
    financial_status: "indigent|rebate|senior citizen|debt|dunning|arrears|insolven|non-payment|handover|legal action|refund|account|billing|invoice|financial|reconnect|disconnect"
    alleged_wrongdoing: "tamper|revenue protection|bypass|suspect illegal|by.?law|contravention|staff complaint"
    property_or_tenancy: "tenan|deeds|acquisition of land|overgrown erven"
